# Run Mayhem API fuzzing when API code changes and a Mayhem token is configured.
name: "Mayhem for API"

on:
  push:
    branches: ["main"]
    paths:
      - "src/server/**"
      - "src/routes/**"
      - "src/router/**"
      - "src/providers/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mayhem-for-api.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/server/**"
      - "src/routes/**"
      - "src/router/**"
      - "src/providers/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mayhem-for-api.yml"

jobs:
  mayhem-for-api:
    name: Mayhem for API
    runs-on: ubuntu-latest
    env:
      MAYHEM_TOKEN: ${{ secrets.MAYHEM_TOKEN }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start API and wait for readiness
        if: ${{ env.MAYHEM_TOKEN != '' }}
        run: |
          npm install --no-audit --no-fund
          PORT=3000 npm run api > /tmp/xbo-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/openapi.json > /dev/null; then
              echo "x-bo API and OpenAPI endpoint are ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/xbo-api.log
          echo "x-bo API did not become ready in time."
          exit 1

      - name: Mayhem for API
        if: ${{ env.MAYHEM_TOKEN != '' }}
        uses: ForAllSecure/mapi-action@v1
        with:
          mayhem-token: ${{ env.MAYHEM_TOKEN }}
          api-url: http://127.0.0.1:3000
          api-spec: http://127.0.0.1:3000/openapi.json
          duration: 60
          sarif-report: mapi.sarif

      - name: Upload SARIF file
        if: ${{ always() && hashFiles('mapi.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mapi.sarif

      - name: Explain skipped Mayhem scan
        if: ${{ env.MAYHEM_TOKEN == '' }}
        run: echo "Mayhem API scan skipped because the MAYHEM_TOKEN repository secret is not configured."
